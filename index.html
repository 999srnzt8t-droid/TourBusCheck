<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tour Bus Check</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="login-container">

        <div class="login-box">

            <h1>🚌 Tour Bus Check</h1>

            <h2>ระบบเช็กชื่อสมาชิกในรถทัวร์</h2>

            <form>

                <input
                    type="email"
                    placeholder="กรอกอีเมล"
                >

                <input
                    type="password"
                    placeholder="กรอกรหัสผ่าน"
                >

                <button type="submit">
                    เข้าสู่ระบบ
                </button>

            </form>

        </div>

    </div>

</body>

</html>
